version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/agrinex
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=agrinex_prod_jwt_secret_token_2026
      - AI_SERVICE_URL=http://ai:8000
      - DATA_GOV_IN_API_KEY=${DATA_GOV_IN_API_KEY:-}
      - MARKET_PRICE_CACHE_TTL=${MARKET_PRICE_CACHE_TTL:-3600}
      - MARKET_API_TIMEOUT=${MARKET_API_TIMEOUT:-10000}
      - MARKET_API_MAX_RETRIES=${MARKET_API_MAX_RETRIES:-3}
    depends_on:
      - mongo
      - redis
      - ai
    restart: unless-stopped

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
